services:
  api:
    build: .
    container_name: online_exam_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: sqlite:///./exam.db
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: online_exam_redis
    ports:
      - "6379:6379"